plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${fabric_loom_version}"
}

version = "${project.version}+${project.minecraft_version}+fabric"

fabricApi {
	configureDataGeneration()
}

loom {
	mods {
		'simplyboots' {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	maven {
		name = 'Florens'
		url = 'https://maven.florens.be/releases/'
	}
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases/'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${project.geckolib_version}"
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"
	modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.ccapi_version}")
	modImplementation include("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.ccapi_version}")
	modImplementation include("be.florens:expandability-fabric:${project.expandability_version}")
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	["COPYING", "COPYING.LESSER"].each { license ->
		from(license) {
			rename { "${it}_$projectName" }
		}
	}
}

sourceSets {
	dummy {
		compileClasspath += configurations.compileClasspath
	}
	main {
		compileClasspath += dummy.output
	}
}
